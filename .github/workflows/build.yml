name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Generate icon
        run: python make_icon.py

      - name: Fetch agent icons
        run: python fetch_icons.py
        continue-on-error: true

      - name: Build EXE
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name HeadroomSwitch
          --icon icon.ico --add-data "icon.ico;." --add-data "icons.json;."
          --hidden-import webview.platforms.winforms
          --hidden-import webview.platforms.edgechromium
          --hidden-import pystray --hidden-import pystray._win32
          --collect-submodules pystray
          app.py

      - uses: actions/upload-artifact@v4
        with:
          name: HeadroomSwitch-windows
          path: dist/HeadroomSwitch.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HeadroomSwitch.exe
